in_source: |-
  .equ OUTPUT_PORT 0xFFFFF1

  .section .data
  msg: .string "Hello, World!\n"
  str_addr: .word 0

  .section .text
  start:
      LOAD #msg
      CALL print_string
      HALT

  print_string:
      STORE str_addr

  loop:
      LOAD [str_addr]
      JZ done
      STORE OUTPUT_PORT
      LOAD str_addr
      INC
      STORE str_addr
      JMP loop

  done:
      RET
config:
  memory_size: 1024
  limit: 1000
  output_format: char
ticks: 331
out_stdout: |
  Hello, World!
out_code: |-
  0 - 11000000 - load 0
  1 - C0000003 - call 0x03
  2 - F7000000 - halt
  3 - 2000000F - store 0x0F
  4 - 1200000F - load 0x0F
  5 - 8000000B - jz 0x0B
  6 - 20FFFFF1 - store 0xFFFFF1
  7 - 1000000F - load 0x0F
  8 - F3000000 - inc
  9 - 2000000F - store 0x0F
  10 - 70000004 - jmp 0x04
  11 - F6000000 - ret
