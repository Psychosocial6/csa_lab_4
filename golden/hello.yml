in_source: |-
  .equ OUTPUT_PORT 0xFFFFF1

  .section .data
  msg: .string "Hello, World!\n"
  str_addr: .word 0

  .section .text
  start:
      LOAD #msg
      CALL print_string
      HALT

  print_string:
      STORE str_addr

  loop:
      LOAD [str_addr]
      JZ done
      STORE OUTPUT_PORT
      LOAD str_addr
      ADD #4
      STORE str_addr
      JMP loop

  done:
      RET
config:
  memory_size: 1024
  limit: 1000
  output_format: char
ticks: 345
out_stdout: |
  Hello, World!
out_code: |-
  0 - 11000000 - load 0
  1 - C000000C - call 0x0C
  2 - F7000000 - halt
  3 - 2000003C - store 0x3C
  4 - 1200003C - load 0x3C
  5 - 8000002C - jz 0x2C
  6 - 20FFFFF1 - store 0xFFFFF1
  7 - 1000003C - load 0x3C
  8 - 31000004 - add 4
  9 - 2000003C - store 0x3C
  10 - 70000010 - jmp 0x10
  11 - F6000000 - ret
