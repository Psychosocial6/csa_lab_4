in_source: |
  .equ OUTPUT_PORT 0xFFFFF1
  .equ INPUT_PORT  0xFFFFF0

  .section .text

  .org 0x10
  handler:
      LOAD INPUT_PORT
      STORE OUTPUT_PORT
      IRET

  start:
      EI

  loop:
      JMP loop
in_stdin: |-
  50,H
  100,e
  150,l
  200,l
  250,o
ticks: 10000
out_stdout: Hello
