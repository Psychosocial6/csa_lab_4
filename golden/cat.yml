in_source: |
  .equ OUTPUT_PORT 0xFFFFF1
  .equ INPUT_PORT  0xFFFFF0

  .section .text

  .org 0x10
  handler:
      LOAD INPUT_PORT
      STORE OUTPUT_PORT
      IRET

  start:
      EI

  loop:
      JMP loop
in_stdin: |-
  50,"H"
  100,"e"
  150,"l"
  200,"l"
  250,"o"
config:
  memory_size: 1024
  limit: 1000
  output_format: char
ticks: 1000
out_stdout: Hello
out_code: |-
  0 - 00000000 - nop
  1 - 00000000 - nop
  2 - 00000000 - nop
  3 - 00000000 - nop
  4 - 10FFFFF0 - load 0xFFFFF0
  5 - 20FFFFF1 - store 0xFFFFF1
  6 - F2000000 - iret
  7 - F0000000 - ei
  8 - 70000020 - jmp 0x20
