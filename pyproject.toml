[tool.poetry]
name = "csa-lab4"
version = "0.1.0"
description = "csa lab 4: asm | acc | harv | hw | tick | binary | trap | mem | cstr | alg2 | pipeline"
authors = ["Andrey Zykov"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-golden = "^0.2.2"
ruff = "^0.1.3"
mypy = "^1.4.1"
coverage = "^7.2.7"
types-pyyaml = "^6.0.12.20260518"
pyyaml = "^6.0.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
enable_assertion_pass_hook = true
addopts = "--doctest-modules"
log_format = "%(levelname)-7s %(module)s:%(funcName)-13s %(message)s"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "N",
    "I",
    "C90",
    "UP",
    "ERA",
    "YTT",
    "ASYNC",
    "A",
    "COM",
    "FA",
    "ICN",
    "INP",
    "T20",
    "PT",
    "Q",
    "RET",
    "PTH",
    "PD",
    "TRY",
    "RUF",
]
ignore = [
    "COM812",
    "E501",
    "T201",
    "RUF002",
    "RUF003",
    "PTH123",
    "PTH118",
    "UP032",
    "PTH103",
    "PTH120",
    "PTH100",
    "C901",
    "TRY003",
]
unfixable = ["ERA001"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
